services:
  db:
    ports:
      - "1433:1433"

  backend:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    ports: !override
      - "5041:8080"

  simulation:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development

  frontend:
    ports: !override
      - "5173:80"
    depends_on:
      - backend
